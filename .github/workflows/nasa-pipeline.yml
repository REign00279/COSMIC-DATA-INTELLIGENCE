
name: NASA Exoplanet Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run NASA ETL pipeline
        run: python pipeline.py

      - name: Publish updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exoplanet_dashboard_data.csv
          if git diff --cached --quiet; then
            echo "Dashboard data has not changed."
          else
            git commit -m "Refresh NASA exoplanet data"
            git push
          fi
